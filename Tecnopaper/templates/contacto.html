{% extends "base.html" %}

{% block title %}Contacto - Tecnopaper{% endblock %}

{% block content %}
<section class="card">
    <h2>Contáctanos</h2>
    <p>¿Tienes alguna consulta o deseas solicitar un pedido especial? Escríbenos:</p>
    
    <div id="alert-message" class="alert-box"></div>

    <form class="contact-form">
        <div class="form-group">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Tatiana García" required>
        </div>
        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
            <label for="servicio">Servicio de interés:</label>
            <select id="servicio" name="servicio">
                <option value="papeleria">Papelería general</option>
                <option value="impresiones">Impresiones / Fotocopias</option>
                <option value="diseno">Cartelería / Letra Timoteo</option>
                <option value="tecnologia">Soporte Informático</option>
            </select>
        </div>
        <div class="form-group">
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tu consulta..." required></textarea>
        </div>
        <button type="submit" class="btn">Enviar Mensaje</button>
    </form>
</section>
{% endblock %}
